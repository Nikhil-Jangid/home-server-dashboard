[global]
check_update=false

[fs]
# system and pseudo mounts; the page also filters snaps, overlays and tmpfs
hide=/boot.*,/snap.*,/etc,/usr,/tmp,/var/tmp,/run.*,/dev.*

[network]
hide=lo,docker.*,br-.*,veth.*,tunl.*,gre.*,erspan.*,ip_vti.*,ip6_vti.*,ip6tnl.*,ip6gre.*,sit.*

[containers]
disable=False
# list stopped containers too (the page greys them out)
all=True
